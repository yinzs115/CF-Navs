name = "cf-navs"
main = "worker/index.ts"
compatibility_date = "2025-06-01"
keep_vars = true

[[rules]]
type = "Text"
globs = ["**/schema.sql"]
fallthrough = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true   # ← 新增：所有请求先走 Worker

[vars]
INIT_ADMIN_USER = "admin"
SESSION_TTL = "2592000"
SITE_PASSWORD = "135"

[[d1_databases]]
binding = "DB"
database_name = "cf-navs-db"

[[kv_namespaces]]
binding = "SESSION"
