name = "cf-navs"
main = "worker/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat_v2"]
keep_vars = true

[[rules]]
type = "Text"
globs = ["**/schema.sql"]
fallthrough = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
INIT_ADMIN_USER = "admin"
SESSION_TTL = "2592000"
SITE_PASSWORD = "135"

[[d1_databases]]
binding = "DB"
database_name = "cf-navs-db"

[[kv_namespaces]]
binding = "SESSION"
